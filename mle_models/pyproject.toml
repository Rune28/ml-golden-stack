[project]
name = "mle-models"
version = "0.1.0"
description = "MNIST model code (package mnist, no I/O) and the Kubernetes Job entry points around it (package jobs)."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43",
    "clickhouse-connect>=1.10",
    "mlflow-skinny==3.17.0", # same version as the MLflow server
    "numpy>=2.5",
    "pandas>=3.0", # required by mlflow.pytorch, not part of mlflow-skinny
    "torch>=2.14",
]

[project.scripts]
mle-job = "jobs.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
]

# CPU wheels only: the CUDA build pulls several GB of libraries that the
# simulated GPU pool cannot use. A real GPU image would switch this index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/mnist", "src/jobs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
